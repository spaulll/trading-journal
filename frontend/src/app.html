<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Self-hosted trading journal — sync bot trades, review setups and mistakes, track equity and drawdown." />
		<meta name="theme-color" content="#07080b" />
		<meta property="og:title" content="Trading Journal" />
		<meta property="og:description" content="Bot-synced trade history, screenshots and performance analytics." />
		<meta property="og:type" content="website" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
		<script>
			try {
				if ((localStorage.getItem('tj-theme') || 'dark') !== 'dark') {
					document.documentElement.classList.remove('dark');
				}
			} catch (e) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
